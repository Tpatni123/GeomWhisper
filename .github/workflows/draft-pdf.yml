name: Draft PDF

on:
  push:
    paths:
      - paper/paper.md
      - paper/paper.bib
      - paper/images/**
      - .github/workflows/draft-pdf.yml
  pull_request:
    paths:
      - paper/paper.md
      - paper/paper.bib
      - paper/images/**
      - .github/workflows/draft-pdf.yml

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build draft PDF
        uses: docker://pandoc/latex:3.6
        with:
          args: >-
            --citeproc
            --resource-path=paper
            --output=paper.pdf
            paper/paper.md

      - name: Upload paper artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper.pdf